name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  build:
    name: Test and package Angular
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production site
        env:
          PRIMEUI_LICENSE_KEY: ${{ secrets.PRIMEUI_LICENSE_KEY }}
        run: npm run build
      - name: Verify packaged site and access rules
        run: node scripts/verify-azure-deployment.cjs dist/engineering-atlas/browser
      - name: Upload verified deployment package
        uses: actions/upload-artifact@v4
        with:
          name: azure-static-site
          path: dist/engineering-atlas/browser
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy invite-only production site
    needs: build
    if: vars.AZURE_STATIC_WEB_APPS_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment credentials
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo '::error::Add the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret from the EngineeringAtlas Azure resource.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: azure-static-site
          path: dist/engineering-atlas/browser
      - name: Publish the tested package
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/engineering-atlas/browser
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify anonymous access is blocked
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readdirSync('dist/engineering-atlas/browser/courses').find(f => f.endsWith('.json'));
          if (!source || !process.env.SITE_URL) throw new Error('Missing deployment URL or course asset.');
          for (const pathname of ['/', '/courses/' + source]) {
            let blocked = false;
            for (let attempt = 0; attempt < 6; attempt++) {
              const response = await fetch(new URL(pathname, process.env.SITE_URL), { redirect: 'manual' });
              const location = response.headers.get('location') || '';
              if (response.status === 302 && location.includes('/.auth/login/github')) { blocked = true; break; }
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!blocked) throw new Error('Expected GitHub sign-in redirect for ' + pathname);
          }
          console.log('Anonymous requests to the app and direct course JSON require GitHub sign-in.');
          NODE
      - name: Record deployment
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        shell: bash
        run: |
          printf '### EngineeringAtlas\n\nAzure deployment: %s\n\nAccess requires GitHub sign-in and the atlas_reader role.\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
